[project]
name = "galaxy-defender"
version = "1.0.0"
description = "Galaxy Defender Arcade Space Shooter"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.0",
    "Pillow>=10.0.0",
]

[tool.isort]
profile = "black"
src_paths = ["src"]
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
